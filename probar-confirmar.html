<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Confirma tu correo · Trenzia</title>
<link rel="stylesheet" href="probar.css">
</head>
<body>
<main>
 <a class="brand" href="./"><img src="lockup.svg" alt="Trenzia" width="201" height="40"></a>

 <!--
  El enlace del correo trae aquí, y es ESTE botón el que confirma. No se
  confirma al abrir la página: los antivirus del correo (Safe Links de
  Outlook/Hotmail) abren todos los enlaces antes que la persona, y confirmarían
  solos.
 -->
 <section id="pedir">
  <h1>Confirma tu correo</h1>
  <p class="lead">Pulsa el botón para confirmar que este correo es tuyo.</p>
  <button class="primary" id="confirmar" type="button">Confirmar mi correo</button>
 </section>

 <section id="resultado" tabindex="-1" aria-live="polite" hidden></section>

 <footer>
  <p><a href="/oposiciones/">Pruebas físicas por oposición</a></p>
  <p>
   <a href="privacidad.html">Política de privacidad</a>
   <a href="terminos.html">Términos de uso</a>
   <a href="aviso-legal.html">Aviso legal</a>
   <a href="accesibilidad.html">Accesibilidad</a>
  </p>
  <p>Síguenos: <a href="https://www.instagram.com/trenzia.app/" rel="noopener me">Instagram</a> <a href="https://www.tiktok.com/@trenziaapp" rel="noopener me">TikTok</a> <a href="https://www.linkedin.com/company/trenzia/" rel="noopener me">LinkedIn</a></p>
  <p>Contacto: <a href="mailto:soporte@trenzia.es">soporte@trenzia.es</a></p>
 </footer>
</main>

<script>
(() => {
  "use strict";
  const API = "https://zbmtqhipmnsztplraeqk.supabase.co/functions/v1/beta-testers";
  const t = new URLSearchParams(location.search).get("t") || "";
  // El token no se queda en la barra de direcciones (capturas, historial).
  if (t) history.replaceState(null, "", location.pathname);

  const pedir = document.getElementById("pedir");
  const res = document.getElementById("resultado");

  function mostrar(titulo, parrafos, enlace) {
    pedir.hidden = true;
    res.hidden = false;
    res.textContent = "";
    const h = document.createElement("h1");
    h.textContent = titulo;
    res.appendChild(h);
    for (const p of parrafos) {
      const el = document.createElement("p");
      el.textContent = p;
      res.appendChild(el);
    }
    if (enlace) {
      const a = document.createElement("a");
      a.href = enlace[1];
      a.textContent = enlace[0];
      a.className = "primary";
      const p = document.createElement("p");
      p.appendChild(a);
      res.appendChild(p);
    }
    res.focus();
  }

  // Desde el web-66 no hay formulario de alta: quien llega con un enlace viejo va a la
  // página de descarga (web-67).
  const TERMINADA = "La prueba cerrada ha terminado y ya no hace falta apuntarse: Trenzia está en App Store y Google Play.";
  const DESCARGA = ["Descarga Trenzia", "probar.html"];
  // Tras una confirmación correcta: las dos tiendas como enlaces de texto, sin data-origen.
  function tiendas() {
    const p = document.createElement("p");
    const enlace = (texto, href) => {
      const a = document.createElement("a");
      a.href = href;
      a.rel = "noopener";
      a.textContent = texto;
      return a;
    };
    p.append("Ya puedes descargarla en ",
      enlace("App Store", "https://apps.apple.com/es/app/id6794259784"), " y ",
      enlace("Google Play", "https://play.google.com/store/apps/details?id=com.fitsyncopo.app"), ".");
    res.appendChild(p);
  }

  if (!t) {
    mostrar("Falta el enlace", [TERMINADA], DESCARGA);
    return;
  }

  document.getElementById("confirmar").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    b.disabled = true;
    b.textContent = "Confirmando…";
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ accion: "confirmar", t }) });
      const d = await r.json().catch(() => ({}));
      switch (d.estado) {
        case "confirmado":
          mostrar("Plaza reservada", ["Te escribiremos cuando la app esté lista para instalar."]);
          tiendas();
          return;
        case "ya_confirmado":
          mostrar("Tu plaza ya estaba reservada", ["Te escribiremos cuando la app esté lista para instalar."]);
          tiendas();
          return;
        case "lista_espera":
          // Plazas cubiertas al confirmar (A-27).
          mostrar("Estás en la lista de espera", [TERMINADA], DESCARGA);
          return;
        case "caducado":
          mostrar("Este enlace ha caducado", [TERMINADA], DESCARGA);
          return;
        case "baja":
          mostrar("Te diste de baja", [TERMINADA], DESCARGA);
          return;
        case "invalido":
          mostrar("Este enlace no es válido", [TERMINADA], DESCARGA);
          return;
      }
      throw new Error(d.message || "respuesta inesperada");
    } catch {
      b.disabled = false;
      b.textContent = "Confirmar mi correo";
      alert("No hemos podido confirmar. Revisa tu conexión e inténtalo de nuevo.");
    }
  });
})();
</script>
</body>
</html>
